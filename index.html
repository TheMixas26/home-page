<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Домашняя страница</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="greeting" id="greeting"></div>
    <div id="clock">00:00:00</div>

    <button id="settings-toggle" title="Настройки">⚙</button>
    <div id="settings-panel" class="hidden">
        <h3>Настройки</h3>
        <label class="settings-row">
            <input type="checkbox" id="local-mode-checkbox">
            Локальный сервер (музыка + задачи Obsidian)
        </label>
        <label class="settings-row settings-col">
            Адрес сервера
            <input type="text" id="local-server-url" placeholder="http://localhost:5177">
        </label>
        <div id="settings-status"></div>
        <button id="settings-save">Сохранить</button>
    </div>

    <div id="music-controls">
        <button id="music-prev" title="Предыдущий трек" class="hidden">⏮</button>
        <span id="music-track-name" class="hidden"></span>
        <span id="music-time">00:00 / 00:00</span>
        <button id="music-play" title="Пауза/Воспроизвести">⏸</button>
        <button id="music-mute" title="Включить/выключить звук">♬</button>
        <button id="music-next" title="Следующий трек" class="hidden">⏭</button>
        <button id="music-shuffle" title="Перемешать заново" class="hidden">🔀</button>
    </div>

    <div id="tasks-container" class="hidden">
        <div id="tasks-header">Задачи <span id="tasks-count"></span></div>
        <ul id="tasks-list"></ul>
    </div>
    
    <div class="search-container">
        <form id="search-form" action="https://www.google.com/search" method="GET">
            <input type="text" id="search-input" name="q" placeholder="Поиск в Google..." >
        </form>
    </div>
    <script>
    document.getElementById('search-form').addEventListener('submit', function(e) {
        const input = document.getElementById('search-input');
        const value = input.value.trim();
        if (/^(https?:\/\/|ftp:\/\/|file:\/\/|www\.)/i.test(value)) {
            e.preventDefault();
            let url = value;
            if (!/^https?:\/\//i.test(url) && !/^ftp:\/\//i.test(url) && !/^file:\/\//i.test(url)) {
                url = 'http://' + url;
            }
            window.location.href = url;
        }
    });
    </script>
    
    <div class="links">
        <a href="https://google.com">Google</a>
        <a href="https://youtube.com">YouTube</a>
        <a href="https://github.com">GitHub</a>
        <a href="https://translate.google.com">Переводчик</a>
    </div>
    
    <div class="links">
        <a href="https://ya.ru">Yandex</a>
        <a href="https://rustdesk.com/web/">RustDesk</a>
        <a href="https://docs.google.com">Google Docs</a>
        <a href="https://mail.google.com">Gmail</a>
    </div>
    <div id="quote-container">
        <div id="quote">Загрузка цитаты...</div>
        <button id="refresh-quote">⟳</button>
    </div>
    

    <div id="weather">Загрузка погоды...</div>

    <audio id="bg-music" src="music.mp3" loop></audio>

    <div id="particles-js"></div>

    <script src="https://cdn.jsdelivr.net/npm/tsparticles@1/tsparticles.min.js"></script>
    <script src="script.js"></script>
    <div id="calendar-container">
        <div id="calendar"></div>
    </div>
    <!-- <div id="countdown-container">
        <h2>Обратный отсчёт до события</h2>
        <div id="countdown">Загрузка...</div>
        <input type="datetime-local" id="new-deadline">
        <button id="set-deadline">Установить дату</button>
        <button id="reset-deadline">Сбросить таймер</button>
    </div> -->
</div>
</body>
</html>
