<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Домашняя страница</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="greeting" id="greeting"></div>
    <div id="clock">00:00:00</div>
    
    <div class="search-container">
        <form action="https://www.google.com/search" method="GET">
            <input type="text" name="q" placeholder="Поиск в Google..." autofocus>
        </form>
    </div>
    
    <div class="links">
        <a href="https://google.com"">Google</a>
        <a href="https://youtube.com">YouTube</a>
        <a href="https://github.com">GitHub</a>
        <a href="https://translate.google.com">Переводчик</a>
    </div>
    
    <div class="links">
        <a href="https://ya.ru" target="_blank">Yandex</a>
        <a href="https://chat.openai.com" target="_blank">ChatGPT</a>
        <a href="obsidian://open?vault=MAIN1">Obsidian</a>
        <a href="https://mail.google.com" target="_blank">Почта</a>
    </div>
    <div id="quote-container">
        <div id="quote">Загрузка цитаты...</div>
        <button id="refresh-quote">⟳</button>
    </div>
    

    <div id="weather">Загрузка погоды...</div>

    <audio id="bg-music" src="music.mp3" loop></audio>

    <div id="particles-js"></div>

    <script src="https://cdn.jsdelivr.net/npm/tsparticles@1/tsparticles.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
